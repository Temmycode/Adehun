name: adehun_mvp
description: "Adehun — Modern Escrow Mobile App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  intl: ^0.19.0
  iconsax_flutter: ^1.0.1
  shared_preferences: ^2.3.4
  dio: ^5.9.2
  retrofit: ^4.9.2
  json_annotation: ^4.9.0
  google_sign_in: ^7.2.0
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  flutter_secure_storage: ^10.0.0
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  uuid: ^4.5.3
  file_picker: ^11.0.2
  mime: ^2.0.0
  paystack_flutter_sdk: ^0.0.1-alpha.2
  web_socket_channel: ^3.0.3
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2
  gap: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  retrofit_generator: ^10.0.1
  build_runner: ^2.6.0
  json_serializable: ^6.10.0
  riverpod_generator: ^4.0.3
  mocktail: ^1.0.4
  http_mock_adapter: ^0.6.1

flutter:
  uses-material-design: true

  assets:
    - assets/illustrations/
    - assets/icons/
    - assets/fonts/
