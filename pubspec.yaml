name: adehun_mvp
description: "Adehun — Modern Escrow Mobile App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  intl: ^0.19.0
  iconsax_flutter: ^1.0.1
  shared_preferences: ^2.3.4
  dio: ^5.9.2
  retrofit: ^4.9.2
  logger: ^2.6.0
  json_annotation: ^4.9.0
  get_it: ^9.2.1
  provider: ^6.1.5+1
  google_sign_in: ^7.2.0
  firebase_core: ^4.6.0
  flutter_dotenv: ^6.0.0
  firebase_auth: ^6.3.0
  flutter_secure_storage: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  retrofit_generator: ^10.0.1
  build_runner: ^2.6.0
  json_serializable: ^6.10.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/illustrations/
    - assets/icons/
    - assets/images/
