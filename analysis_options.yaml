include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "lib/firebase_options.dart"
  errors:
    # Printing to stdout ships tokens and PII to logcat/oslog in release.
    avoid_print: error
    unused_import: warning
    dead_code: warning

linter:
  rules:
    avoid_print: true
    unnecessary_null_checks: true
